[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

[functions]
  node_bundler = "esbuild"

# `netlify dev` arranca Vite y sirve las funciones en el mismo origen (http://localhost:8888)
[dev]
  framework = "#custom"
  command = "npm run dev"
  targetPort = 5173
  port = 8888

# La API: /api/intent → netlify/functions/intent.mts, etc.
[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/:splat"
  status = 200

# SPA: cualquier otra ruta sirve index.html
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
